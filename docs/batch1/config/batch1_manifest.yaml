    final_artifact_count: 6
    final_score_count: 6
    output: six_submit_ready_T2_pairing_candidates
    score_handoff: manual_user_upload
  - id: B1-C1
    prompt: prompts/B1_C1_T2_COMPOSE_SCALE_PAIRING.md
    task: T2
    atom: combination_G1_plus_J1
    primary_metrics: [TSR, NFS]
    protected_metrics: [DES, DCS, MMD, CSS, SDD, ODS]
    dependencies: [B1-A1, B1-A4]
    output: submit_ready_T2_combined_candidate
    activation: conditional_only_if_A4_was_generated_from_pre_A1_root
