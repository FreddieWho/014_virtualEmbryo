batch_id: VE-B1-20260827
policy:
  one_atom_per_run: true
  auto_submit: false
  max_full_generations_per_atom: 6
  max_final_scores_per_atom: 6
  max_exploration_attempts_per_atom: 4
  max_final_generations_per_lane: 1
  max_final_scores_per_lane_board: 1
  hyperparameter_sweeps: 0
  seeds_per_atom: 1
  broad_refactor: false
  new_external_data: false
atoms:
